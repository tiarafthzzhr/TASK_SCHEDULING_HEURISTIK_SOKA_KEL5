apiVersion: v1
kind: Namespace
metadata:
  name: soka-heuristik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rr-controller
  namespace: soka-heuristik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: soka-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: soka-node-reader
subjects:
  - kind: ServiceAccount
    name: rr-controller
    namespace: soka-heuristik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soka-node-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rr-dispatch
  namespace: soka-heuristik
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rr-dispatch
  namespace: soka-heuristik
subjects:
  - kind: ServiceAccount
    name: rr-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rr-dispatch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rr-results
  namespace: soka-heuristik
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rr-results
  namespace: soka-heuristik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rr-results
  template:
    metadata:
      labels:
        app: rr-results
    spec:
      nodeSelector:
        soka.lab/host: host1
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: results
          image: soka-task-scheduler:v1
          imagePullPolicy: Never
          command: ["python3", "results_server.py"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /results
              readOnly: true
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: rr-results
---
apiVersion: v1
kind: Service
metadata:
  name: rr-results
  namespace: soka-heuristik
spec:
  type: NodePort
  selector:
    app: rr-results
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
